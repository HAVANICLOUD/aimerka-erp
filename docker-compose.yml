services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-}  # Supabase/Postgres; vacío = D1 local
      - SUPABASE_URL=${SUPABASE_URL:-}  # Login con Supabase Auth
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    volumes:
      - erp-data:/app/.wrangler/state   # D1 (SQLite) + R2 (documentos)
    expose:
      - "8787"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Define DOMAIN en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  erp-data:
  caddy-data:
