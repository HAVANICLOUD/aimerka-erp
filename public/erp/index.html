<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a102d">
  <meta name="description" content="AIMERKA V28: pedidos, inventario, compras, gastos, precios y conciliación por lotes con guardado persistente.">
  <title>AiMerka — Operación V28</title>
  <link rel="stylesheet" href="/erp/styles.css">
  <link rel="stylesheet" href="/erp/v28.css">
  <link rel="stylesheet" href="/erp/operations-ui.css">
  <script src="/erp/domain.js" defer></script>
  <script src="/erp/app.js" defer></script>
  <script src="/erp/runtime-v28.js" defer></script>
  <script src="/erp/commerce-v28.js" defer></script>
  <script src="/erp/operations-ui.js" defer></script>
  <script src="/erp/pricing-ui.js" defer></script>
  <script src="/erp/reconciliation-ui.js" defer></script>
  <script src="/erp/boot-v28.mjs" type="module"></script>
</head>
<body>
  <a class="skip" href="#main">Ir al contenido</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal"></aside>
    <div class="app-content">
      <header class="topbar">
        <button class="icon-button menu-button" data-action="menu" aria-label="Abrir menú">☰</button>
        <div class="breadcrumb">Mi espacio <span>/</span> <strong id="crumb">Resumen</strong></div>
        <form id="global-search-form" class="global-search" role="search">
          <span id="search-icon"></span>
          <input id="global-search" aria-label="Buscar por pedido original, SKU o folio SICAR" placeholder="Buscar pedido, SKU o folio…" autocomplete="off">
          <kbd>↵</kbd>
        </form>
        <span class="demo-pill"><span></span> Datos de ejemplo</span>
        <button class="icon-button notification" data-action="incidents" aria-label="Ver incidencias"><span id="bell-icon"></span><i id="notification-count"></i></button>
        <div class="avatar" aria-label="Espacio de Giovanni">G</div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="app-footer"><span>AiMerka · Concepto funcional v0.1</span><span>Simulación local · Ninguna cuenta conectada</span></footer>
    </div>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <section id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></section>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p>Activa JavaScript para explorar la demostración interactiva de AiMerka.</p></noscript>
</body>
</html>
